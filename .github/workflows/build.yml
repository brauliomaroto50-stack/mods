# Este archivo hace que GitHub compile el mod por ti, gratis, en sus servidores.
# No necesitas instalar Java ni nada en tu computadora.
#
# Como usarlo:
#   1. Crea una cuenta en github.com
#   2. Crea un repositorio nuevo (puede ser privado)
#   3. Sube TODOS los archivos de esta carpeta al repositorio
#      (si GitHub te ofrecio agregar su propio workflow de Gradle, no lo
#      aceptes / borralo: solo debe existir ESTE archivo en .github/workflows)
#   4. Entra a la pestana "Actions" del repositorio
#   5. Espera ~3 minutos a que termine (palomita verde)
#   6. Haz clic en la ejecucion y baja hasta "Artifacts"
#   7. Descarga "chatbubbles-jar" -> adentro viene tu .jar

name: Compilar el mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generar gradlew (en una carpeta aparte, para no chocar con Fabric Loom)
        run: |
          mkdir -p /tmp/generador_wrapper
          cd /tmp/generador_wrapper
          touch settings.gradle
          gradle wrapper --gradle-version 8.7 --no-daemon
          cp -r gradle "$GITHUB_WORKSPACE"/
          cp gradlew gradlew.bat "$GITHUB_WORKSPACE"/

      - name: Dar permiso de ejecucion a gradlew
        run: chmod +x gradlew

      - name: Compilar
        run: ./gradlew build --no-daemon

      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: chatbubbles-jar
          path: build/libs/*.jar
