# Este archivo hace que GitHub compile el mod por ti, gratis, en sus servidores.
# No necesitas instalar Java ni nada en tu computadora.

name: Compilar el mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Compilar
        run: ./gradlew build --no-daemon

      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: chatbubbles-jar
          path: build/libs/*.jar
